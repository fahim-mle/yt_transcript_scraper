<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Transcript Scraper</title>
  <style>
    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #252836;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --accent:   #6366f1;
      --accent-h: #818cf8;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --log-bg:   #0a0c12;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header h1 em { font-style: normal; color: var(--accent); }

    #status-bar { display: flex; gap: 20px; }

    .s-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ok   { background: var(--green); }
    .dot.warn { background: var(--yellow); }
    .dot.err  { background: var(--red); }

    /* ── Main layout ───────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      overflow: hidden;
    }

    .top-row {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 12px;
      flex-shrink: 0;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Input panel ───────────────────────────── */
    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--log-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 11px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    input[type="text"]:focus  { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    /* ── Manual paste ──────────────────────────── */
    .manual-wrap { margin-bottom: 12px; }

    .manual-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .manual-toggle:hover { color: var(--text); }
    .manual-toggle .chev { transition: transform 0.15s; font-size: 9px; }
    .manual-wrap.open .manual-toggle .chev { transform: rotate(90deg); }

    .manual-body { display: none; margin-top: 12px; }
    .manual-wrap.open .manual-body { display: block; }

    .manual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    @media (max-width: 720px) { .manual-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .field .hint { font-weight: 400; color: var(--border); }

    textarea {
      background: var(--log-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 11px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
      width: 100%;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); opacity: 0.6; }

    .manual-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .manual-actions .spacer { flex: 1; }
    .checkline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .checkline input { accent-color: var(--accent); }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s, opacity 0.12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }

    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: #2e3244; }

    .stage-row { display: flex; gap: 8px; align-items: center; }

    #job-indicator {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      display: none;
      align-items: center;
      gap: 6px;
    }
    #job-indicator.visible { display: flex; }

    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Log panel ─────────────────────────────── */
    #log-output {
      background: var(--log-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      height: 148px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.65;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── Videos section ────────────────────────── */
    .videos-wrap {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .videos-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .videos-head .panel-label { margin-bottom: 0; }

    #video-count { font-size: 11px; color: var(--muted); }

    .table-scroll { overflow-y: auto; flex: 1; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      position: sticky; top: 0;
      background: #1c1f2e;
      padding: 7px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(99,102,241,0.04); }

    td {
      padding: 9px 16px;
      font-size: 12.5px;
      color: var(--text);
      vertical-align: middle;
    }

    td.dim { color: var(--muted); }

    .cell-title {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    td a {
      color: var(--accent);
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
    }
    td a:hover { color: var(--accent-h); }

    .empty-msg {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    #error-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #3b0a0a;
      border: 1px solid var(--red);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <h1>YT <em>Transcript</em> Scraper</h1>
  <div id="status-bar">
    <div class="s-item"><span class="dot" id="dot-db"></span><span id="lbl-db">DB</span></div>
    <div class="s-item"><span class="dot" id="dot-blob"></span><span id="lbl-blob">Blob</span></div>
    <div class="s-item"><span class="dot" id="dot-clean"></span><span id="lbl-clean">Storage</span></div>
  </div>
</header>

<main>
  <div class="top-row">

    <!-- Controls -->
    <div class="panel">
      <div class="panel-label">Pipeline</div>
      <div class="url-row">
        <input type="text" id="url-input"
               placeholder="YouTube URL, playlist, or channel…"
               onkeydown="if(event.key==='Enter') scrape()">
        <button class="btn btn-primary" id="btn-scrape" onclick="scrape()">Scrape</button>
      </div>
      <div class="stage-row">
        <button class="btn btn-secondary" id="btn-clean"  onclick="runStage('clean')">Clean</button>
        <button class="btn btn-secondary" id="btn-rewrite" onclick="runStage('rewrite')"
                title="Rewrites cleaned transcripts into readable articles. Slow — hours for a long video. Resumable, so closing this page does not lose progress.">Rewrite</button>
        <button class="btn btn-secondary" id="btn-enrich" onclick="runStage('enrich')">Enrich</button>
        <button class="btn btn-secondary" id="btn-ingest" onclick="runStage('ingest')">Ingest</button>
        <button class="btn btn-primary"   id="btn-runall" onclick="runAll()"
                title="Runs clean → rewrite → enrich → ingest back to back (scrape first if a URL is in the box)">Run All</button>
        <div id="job-indicator">
          <div class="spinner"></div>
          <span id="job-label">running…</span>
        </div>
      </div>

      <!-- Manual paste — for when YouTube blocks transcript fetching -->
      <div class="manual-wrap" id="manual-wrap" style="margin-top:12px;">
        <div class="manual-toggle" onclick="toggleManual()">
          <span class="chev">▶</span>
          <span>Paste transcript manually</span>
        </div>

        <div class="manual-body">
          <div class="field" style="margin-bottom:10px;">
            <label for="m-url">Video URL or ID <span class="hint">— required</span></label>
            <input type="text" id="m-url" placeholder="https://www.youtube.com/watch?v=… or the 11-character id">
          </div>

          <div class="field" style="margin-bottom:10px;">
            <label for="m-description">Description <span class="hint">— paste the description box text</span></label>
            <textarea id="m-description" rows="4"
                      placeholder="Paste the video description here…"></textarea>
          </div>

          <div class="field">
            <label for="m-transcript">Transcript <span class="hint">— required; timestamps, SRT/VTT or plain text all work</span></label>
            <textarea id="m-transcript" rows="10"
                      placeholder="Paste the transcript here…&#10;&#10;0:00 works, as does plain prose with no timestamps."></textarea>
          </div>

          <div class="manual-grid" style="margin-top:10px;">
            <div class="field">
              <label for="m-title">Title <span class="hint">— optional</span></label>
              <input type="text" id="m-title" placeholder="Auto-fetched if left blank">
            </div>
            <div class="field">
              <label for="m-channel">Channel <span class="hint">— optional</span></label>
              <input type="text" id="m-channel" placeholder="Auto-fetched if left blank">
            </div>
          </div>

          <div class="manual-actions">
            <label class="checkline">
              <input type="checkbox" id="m-fetch-meta" checked>
              Fetch title/channel/chapters with yt-dlp
            </label>
            <div class="spacer"></div>
            <button class="btn btn-secondary" onclick="clearManual()">Clear</button>
            <button class="btn btn-primary" id="btn-manual" onclick="submitManual()">Add transcript</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div class="panel">
      <div class="panel-label">Log</div>
      <pre id="log-output">Waiting for jobs…</pre>
    </div>

  </div>

  <!-- Videos table -->
  <div class="videos-wrap">
    <div class="videos-head">
      <div class="panel-label">Scraped Videos</div>
      <span id="video-count">—</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Channel</th>
            <th>Published</th>
            <th>Words</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="error-toast"></div>

<script>
  // Job state is owned by the server. /api/status is polled and is the only
  // thing that decides whether a button is disabled; SSE carries log lines
  // only. That split is what makes a page reload — or a dropped stream —
  // recover instead of showing a phantom failure.
  const POLL_MS = 3000;
  const DETACH_GRACE_MS = 6000;   // don't drop a stream a poll hasn't seen yet

  const _streams = {};            // job id → {es, label, since, onSuccess}
  let _busy = {heavy: null, light: null};
  let _logPrimed = false;

  // ── Helpers ──────────────────────────────────────────────────────

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const HEAVY_BUTTONS = ['btn-scrape','btn-clean','btn-rewrite','btn-enrich','btn-ingest','btn-runall'];

  function applyBusy() {
    HEAVY_BUTTONS.forEach(id => {
      document.getElementById(id).disabled = !!_busy.heavy;
    });
    // The manual add only ever waits on another manual add.
    document.getElementById('btn-manual').disabled = !!_busy.light;

    // The server owns the label; the client never invents a second name for
    // the same job, so nothing changes under you when a poll lands.
    const active = [_busy.heavy, _busy.light].filter(Boolean);
    document.getElementById('job-indicator').className = active.length ? 'visible' : '';
    document.getElementById('job-label').textContent =
      active.length ? active.map(j => j.label).join(' + ') + '…' : '';
  }

  function appendLog(text, label) {
    const el = document.getElementById('log-output');
    if (!_logPrimed) { el.textContent = ''; _logPrimed = true; }
    const atBottom = el.scrollHeight - el.clientHeight <= el.scrollTop + 8;
    const prefix = (label && Object.keys(_streams).length > 1) ? `[${label}] ` : '';
    el.textContent += prefix + text + '\n';
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log-output').textContent = '';
    _logPrimed = true;
  }

  function showError(msg) {
    const t = document.getElementById('error-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  // FastAPI reports validation problems as `detail`, our handlers as `error`.
  // Missing both without a job_id still means the request went nowhere.
  function apiError(d) {
    if (!d || typeof d !== 'object') return 'Unexpected response from the server';
    if (d.error) return d.error;
    if (d.detail) {
      if (typeof d.detail === 'string') return d.detail;
      const first = Array.isArray(d.detail) ? d.detail[0] : null;
      if (first && first.msg) {
        const field = (first.loc || []).slice(1).join('.');
        return field ? `${field}: ${first.msg}` : first.msg;
      }
      return JSON.stringify(d.detail);
    }
    return d.job_id ? null : 'Unexpected response from the server';
  }

  // ── SSE streams ──────────────────────────────────────────────────

  function attach(jobId, label, onSuccess) {
    if (_streams[jobId]) return;
    const es = new EventSource(`/api/jobs/${jobId}/stream`);
    _streams[jobId] = {es, label, since: Date.now(), onSuccess};

    es.onmessage = e => appendLog(e.data, label);

    es.addEventListener('done', e => {
      const succeeded = e.data === 'done';
      const onDone = _streams[jobId] && _streams[jobId].onSuccess;
      detach(jobId);
      if (succeeded && onDone) onDone();
      if (!succeeded) showError(`${label} failed — check the log.`);
      loadVideos();
      loadStatus();
    });

    // Deliberately no onerror handler that touches job state: the browser
    // reconnects on its own and the server replays from Last-Event-ID, so a
    // blip is invisible. If the job really died, the next poll notices.
  }

  function detach(jobId) {
    const stream = _streams[jobId];
    if (!stream) return;
    stream.es.close();
    delete _streams[jobId];
  }

  // Reconcile local state with what the server says is running.
  function syncJobs(jobs) {
    const running = {heavy: null, light: null};
    const live = new Set();
    jobs.forEach(j => { running[j.class] = j; live.add(j.id); });
    _busy = running;
    applyBusy();

    // Reattach after a reload, or pick up a job started from another tab.
    jobs.forEach(j => attach(j.id, j.label));

    const now = Date.now();
    Object.keys(_streams).forEach(id => {
      if (!live.has(id) && now - _streams[id].since > DETACH_GRACE_MS) detach(id);
    });
  }

  // ── Actions ──────────────────────────────────────────────────────

  function post(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    }).then(r => r.json().catch(() => ({error: `Server returned HTTP ${r.status}`})));
  }

  function start(path, body, klass, onSuccess) {
    if (_busy[klass]) return;
    post(path, body)
      .then(d => {
        const err = apiError(d);
        if (err) { showError(err); return; }
        if (!Object.keys(_streams).length) clearLog();
        // Optimistic: don't wait up to POLL_MS to disable the buttons.
        _busy[klass] = {id: d.job_id, label: d.label};
        applyBusy();
        attach(d.job_id, d.label, onSuccess);
      })
      .catch(e => showError(String(e)));
  }

  function scrape() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) { showError('Paste a YouTube URL first.'); return; }
    start('/api/scrape', {url}, 'heavy');
  }

  function runStage(stage) {
    start(`/api/${stage}`, {}, 'heavy');
  }

  function runAll() {
    start('/api/run-all', {url: document.getElementById('url-input').value.trim()}, 'heavy');
  }

  // ── Manual paste ─────────────────────────────────────────────────

  function toggleManual() {
    document.getElementById('manual-wrap').classList.toggle('open');
  }

  function clearManual() {
    ['m-url', 'm-description', 'm-transcript', 'm-title', 'm-channel']
      .forEach(id => document.getElementById(id).value = '');
  }

  function submitManual() {
    const val = id => document.getElementById(id).value.trim();

    if (!val('m-url'))        { showError('Video URL or ID is required'); return; }
    if (!val('m-transcript')) { showError('Transcript is required');      return; }

    start('/api/manual', {
      url:            val('m-url'),
      transcript:     document.getElementById('m-transcript').value,
      description:    document.getElementById('m-description').value,
      title:          val('m-title'),
      channel:        val('m-channel'),
      fetch_metadata: document.getElementById('m-fetch-meta').checked,
    }, 'light', clearManual);
  }

  // ── Videos table ─────────────────────────────────────────────────

  function loadVideos() {
    fetch('/api/videos')
      .then(r => r.json())
      .then(videos => {
        const tbody = document.getElementById('tbody');
        const count = document.getElementById('video-count');
        count.textContent = videos.length + ' video' + (videos.length !== 1 ? 's' : '');

        if (!videos.length) {
          tbody.innerHTML =
            '<tr><td colspan="5" class="empty-msg">No videos yet — paste a URL and click Scrape.</td></tr>';
          return;
        }

        tbody.innerHTML = videos.map(v => `
          <tr>
            <td class="cell-title" title="${esc(v.title)}">${esc(v.title)}</td>
            <td class="dim">${esc(v.channel)}</td>
            <td class="dim">${esc(v.published || '—')}</td>
            <td class="dim">${v.word_count ? v.word_count.toLocaleString() : '—'}</td>
            <td><a href="${esc(v.url)}" target="_blank" rel="noopener" title="Open on YouTube">↗</a></td>
          </tr>`).join('');
      })
      .catch(() => {});
  }

  // ── Status bar ───────────────────────────────────────────────────

  function loadStatus() {
    return fetch('/api/status')
      .then(r => r.json())
      .then(s => {
        setDot('db',    s.database     === 'configured', s.database);
        setDot('blob',  s.blob_storage === 'mounted',    s.blob_storage);
        setDot('clean', s.clean_storage === 'available', s.clean_storage);
        syncJobs(s.jobs || []);
      })
      .catch(() => {});   // a dropped poll is not something to shout about
  }

  function setDot(name, ok, label) {
    document.getElementById('dot-' + name).className = 'dot ' + (ok ? 'ok' : 'warn');
    document.getElementById('lbl-' + name).textContent =
      {db: 'DB', blob: 'Blob', clean: 'Storage'}[name] + ': ' + label;
  }

  // ── Init ─────────────────────────────────────────────────────────
  loadStatus();
  loadVideos();
  setInterval(loadStatus, POLL_MS);
</script>
</body>
</html>
